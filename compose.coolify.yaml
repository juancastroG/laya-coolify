services:
  laya-serve:
    build:
      context: .
      args:
        TORCH_INDEX: cpu
        TORCH_VERSION: "2.14.0"
    command: ["laya-serve"]
    environment:
      LAYA_HOST: 0.0.0.0
      LAYA_PORT: "8000"
      LAYA_DEVICE: cpu
      LAYA_API_KEY: ${LAYA_API_KEY}
      LAYA_PRELOAD: "1"
      LAYA_MODELS: ${LAYA_MODELS:-multilingual}
      LAYA_MAX_LOADED: ${LAYA_MAX_LOADED:-2}
      LAYA_THREADS: "4"
      OMP_NUM_THREADS: "4"
      LAYA_MAX_CONCURRENT: "4"
    expose:
      - "8000"
    volumes:
      - model-cache:/home/laya/.cache/huggingface
    init: true
    restart: unless-stopped
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m

volumes:
  model-cache:
